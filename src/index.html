<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css" integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="container" id="bookmarkApp">
  <h1>Закладки</h1>
  <form id="bookmarkForm">
    <input
      type="url"
      id="bookmarkInput"
      placeholder="URL"
      required
    >
    <button type="submit" id="addBookmarkBtn">Додати</button>
  </form>
  <ul id="bookmarkList"></ul>
</div>
<div class="container" id="formApp">
  <h1>Форма</h1>
  <form id="userForm">
    <input 
      type="text" 
      id="username" 
      name="name" 
      placeholder="Логін" 
      required
    >
    <input 
      type="password" 
      id="password" 
      name="password" 
      placeholder="Пароль" 
      required
    >
    <button type="submit" id="saveBtn">Зберегти</button>
  </form>
</div>

<div class="market">
    <div class="search-container">
        <input 
        type="text" 
        id="search-input" 
        placeholder="Шукати продукт за назвою або описом..." 
        />
    </div>
    <div class="products__box"></div>
</div>

    <script type="module" src="./js/index.js"></script>
</body>
</html>
